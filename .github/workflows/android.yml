name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Paisatenso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Paisatenso-apk
          path: Paisatenso.apk

      # A release gives a direct download link you can open on your phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Paisatenso build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Paisatenso.apk
          body: |
            Install on Android: download **Paisatenso.apk** on your phone, open it, and allow "Install unknown apps" for your browser when prompted.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
